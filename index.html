<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevStudio Academy — laboratorium pribadi untuk belajar dan membangun website." />
    <title>DevStudio Academy</title>
    <script>
      // Terapkan tema sebelum React dimuat agar tidak ada kedipan putih.
      try {
        var s = JSON.parse(localStorage.getItem('devstudio:v1') || '{}');
        if (s.settings && s.settings.theme === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
